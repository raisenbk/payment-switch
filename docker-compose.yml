name: payment-switch

# Host ports are bound to 127.0.0.1 only: the dev defaults (passwords, tokens) must not be
# reachable from the local network.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-paymentswitch}
      POSTGRES_USER: ${DB_USER:-paymentswitch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paymentswitch}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-supplier:
    build:
      context: .
      args:
        MODULE: mock-supplier
    environment:
      MOCK_SUPPLIER_DELAY: ${MOCK_SUPPLIER_DELAY:-15s}
    ports:
      - "127.0.0.1:${MOCK_SUPPLIER_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        MODULE: app
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-paymentswitch}
      DB_USER: ${DB_USER:-paymentswitch}
      DB_PASSWORD: ${DB_PASSWORD:-paymentswitch}
      # Local-development key only; set your own in .env for anything else.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-JNZXg1RmDZjrHIsESBJhQXphJL8/m69RMlf1pH8LoZo=}
      MOCK_SUPPLIER_URL: http://mock-supplier:8090
      # Local-development admin token only (X-Admin-Token on /admin/**).
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-admin-token-not-secret}
      # Traces to Jaeger (OTLP/HTTP); logs as structured JSON (ECS) with traceId, merchantId, transactionId.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-supplier:
        condition: service_healthy

  # --- Observability and docs (Phase 8) -------------------------------------------------------

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"   # UI; OTLP (4317/4318) is only reachable inside the network

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # Dashboards are readable without logging in; admin login is only needed to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payment-switch.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.1
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      # Requests must be HMAC-signed, which a browser form cannot do: read-only docs, use
      # scripts/signed-curl.sh to call the API.
      SUPPORTED_SUBMIT_METHODS: "[]"
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"

volumes:
  postgres-data:
