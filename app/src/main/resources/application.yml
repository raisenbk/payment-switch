spring:
  application:
    name: payment-switch
  profiles:
    default: local
  autoconfigure:
    # Merchants authenticate with HMAC signatures; no username/password users exist.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  batch:
    job:
      # Jobs are started explicitly (settlement import), never at startup.
      enabled: false
    jdbc:
      # The job repository tables are created by Flyway (V8).
      initialize-schema: never

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: payment-switch
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Every request is traced (fine for a demo; lower it under real load).
      probability: 1.0
  otlp:
    # Metrics are scraped by Prometheus and logs go to stdout; only traces are exported via OTLP.
    metrics:
      export:
        enabled: false
    logging:
      export:
        enabled: false
  # Traces go to management.opentelemetry.tracing.export.otlp.endpoint, set by docker-compose. Unset
  # (tests, plain local runs) they are created for log correlation but not exported.

payment-switch:
  auth:
    timestamp-tolerance: 5m
    max-body-size: 64KB
  admin:
    # Shared operator token for /admin/** (X-Admin-Token). Unset = admin API disabled.
    token: ${ADMIN_API_TOKEN:}
  crypto:
    # Base64-encoded 32-byte AES key for secrets at rest. Generate with: openssl rand -base64 32
    secret-key: ${SECRET_ENCRYPTION_KEY}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} requestId=%X{requestId:-} merchantId=%X{merchantId:-} transactionId=%X{transactionId:-}] "
