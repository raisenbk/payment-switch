spring:
  application:
    name: payment-switch
  profiles:
    default: local
  autoconfigure:
    # Merchants authenticate with HMAC signatures; no username/password users exist.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

payment-switch:
  auth:
    timestamp-tolerance: 5m
    max-body-size: 64KB
  admin:
    # Shared operator token for /admin/** (X-Admin-Token). Unset = admin API disabled.
    token: ${ADMIN_API_TOKEN:}
  crypto:
    # Base64-encoded 32-byte AES key for secrets at rest. Generate with: openssl rand -base64 32
    secret-key: ${SECRET_ENCRYPTION_KEY}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} merchantId=%X{merchantId:-} transactionId=%X{transactionId:-}] "
