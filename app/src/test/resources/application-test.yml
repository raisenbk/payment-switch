# Datasource is provided by Testcontainers via @ServiceConnection (see AbstractIntegrationTest).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/testmigration

payment-switch:
  suppliers:
    mocka:
      # base-url is set by AbstractIntegrationTest (mock-supplier container)
      connect-timeout: 1s
      read-timeout: 1s
  # Fast schedules so failure scenarios finish in seconds (production defaults are in the
  # *Properties records).
  outbox:
    poll-interval: 100ms
    lease: 10s
    retry-initial-delay: 200ms
  inquiry:
    poll-interval: 100ms
    initial-delay: 300ms
    max-delay: 1s
    max-window: 6s
    verify-after: 3s
  webhooks:
    poll-interval: 100ms
    lease: 5s
    max-attempts: 4
    initial-delay: 200ms
    max-delay: 800ms
    read-timeout: 1s
  admin:
    # Test-only token. Never used outside the test profile.
    token: test-admin-token-not-secret
  crypto:
    # Test-only key. Never used outside the test profile.
    secret-key: 7L/6T3v6cowfXHu0UvIU4He4pU1J7F2JeHdUD0TZtgk=

logging:
  level:
    org.testcontainers: INFO
    com.paymentswitch: DEBUG
